<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="contact.css">
</head>

<body>
    <!-- navbar create krengay  -->
    <nav>
        <h2>Watch Store ⌚</h2>
        <div class="links">
            <a href="home.html">Home</a>
            <a href="about.html">About</a>
            <a href="product.html">Product</a>
            <a href="contact.html">Contact</a>
        </div>
    </nav>


    <!-- contact section  -->
    <section class="contact-section">
        <div class="contact-container">
            <!-- form start -->
            <div class="contact-form">
                <h2>Contact Us</h2>
                <p>Lorem ipsum dolor sit amet.</p>

                <form>
                    <label>Name</label>
                    <input type="text" placeholder="Enter your name..">

                    <label>Email</label>
                    <input type="email" placeholder="Enter your email..">

                    <label>Subject</label>
                    <input type="text" placeholder="Enter Subject here..">

                    <label>Message</label>
                    <textarea placeholder="Enter your message..."></textarea>

                    <button>Send Message</button>
                </form>
            </div>


            <!-- google map here -->

            <div class="map-container">
                <h2>Find Us</h2>
                <p>Lorem ipsum dolor sit amet.</p>
                <iframe
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3617.9915598559014!2d67.08468887443219!3d24.932357442378635!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3eb33f4eb7183b97%3A0x35709df45c0003aa!2sLuckyOne%20Mall!5e0!3m2!1sen!2s!4v1791959457237!5m2!1sen!2s"
                    width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy"
                    referrerpolicy="strict-origin-when-cross-origin"></iframe>
            </div>

        </div>
    </section>
